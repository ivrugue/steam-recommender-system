{% extends 'master.html' %}

{% block titulo %}
  Fin de carga
{% endblock %}

{% block contenido %}

<div class="d-flex justify-content-center">

  <div class="card form-card shadow-sm" style="min-width: 420px;">
    <div class="card-body text-center">

      <div class="alert alert-success py-2">
        <small>Carga completada correctamente</small>
      </div>

      {% for modelo, total in info.items %}
        <div class="d-flex justify-content-between border-bottom py-2">
          <span class="fw-semibold">{{ modelo }}</span>
          <span>{{ total }}</span>
        </div>
      {% endfor %}

    </div>
  </div>

</div>

{% endblock %}
